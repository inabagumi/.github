name: Node.js

on:
  pull_request:
    branches: [$default-branch]
  push:
    branches: [$default-branch]
    tags: ["!v*"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          cache: true
      - run: pnpm check
      - run: pnpm build
      - run: pnpm test
