name: Node.js

on:
  pull_request:
    branches: [$default-branch]
  push:
    branches: [$default-branch]
    tags: ['!v*']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
      - run: pnpm format-check
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
