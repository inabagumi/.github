name: Node.js

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 14.21.3
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn format-check

  validate-renovate-presets:
    name: Validate Renovate presets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: >-
          npx --yes --package renovate --
          renovate-config-validator --no-global renovate-config/*.json
