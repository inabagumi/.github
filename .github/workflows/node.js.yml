name: Node.js

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
      - run: pnpm format-check

  validate-renovate-presets:
    name: Validate Renovate presets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          install: false
      - run: >-
          pnpm dlx --package renovate
          renovate-config-validator --strict --no-global renovate-config/default.json5
