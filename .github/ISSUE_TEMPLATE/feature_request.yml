name: Feature request
description: Suggest a new feature or an improvement.
type: Feature
body:
  - type: markdown
    attributes:
      value: Thank you for the suggestion. Please search the existing issues before opening a new one.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: The problem this feature would solve, or the reason you want it.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or features you have considered.
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Screenshots, mockups or anything else about the feature request.
