name: Bug report
description: Report something that is not working as expected.
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug. Please search the existing issues before opening a new one.

        Do not report security vulnerabilities here. Follow the security policy instead.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See the error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: The browser, OS, versions and other details of the environment where the bug occurs.
      placeholder: |
        - OS: macOS 26
        - Browser: Chrome 142
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Screenshots, logs or anything else that helps to explain the bug.
